# Publish to JSR (OIDC) and npm (provenance) on every version tag.

name: publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # ← OIDC for JSR + npm provenance

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Cache deps
        run: deno ci

      - name: Publish to JSR
        run: deno publish

      - name: Build & publish to npm
        run: |
          deno task package
          npm publish --provenance
