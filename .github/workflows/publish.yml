# Publish to JSR (OIDC) and npm (provenance) on every version tag.
#
# npm requires a manual first publish (`npm publish`) to establish the
# package.  After that, OIDC + provenance works automatically.
#
# Setup:
#   1. jsr.io → Settings → Linked Accounts → link GitHub Actions
#   2. npm → Package → Settings → "Connect to GitHub" (one-time)
#   3. Tag:  git tag v0.1.3 && git push --tags

name: publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # ← OIDC for both JSR and npm provenance

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Build package
        run: deno task package

      - name: Publish to JSR
        run: deno publish

      - name: Publish to npm (with provenance)
        run: npm publish --provenance
