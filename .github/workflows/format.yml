# Check formatting with oxfmt on every push.
# Fails if any file is not properly formatted.

name: format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check formatting
        run: |
          deno ci
          deno x oxfmt --check .
