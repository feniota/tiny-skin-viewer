# Auto-format all supported files with oxfmt on every push.
# If formatting changes are made, they are committed back to the branch.

name: format

on:
  push:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install oxfmt
        run: npm install -g oxfmt

      - name: Format
        run: oxfmt --write .

      - name: Commit changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: auto-format with oxfmt"
            git push
          fi
